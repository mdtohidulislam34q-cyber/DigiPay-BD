<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<title>Payment QR Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  font-family:'Hind Siliguri',sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#2563eb,#06b6d4);
  padding:20px;
}

.card{
  background:#fff;
  width:100%;
  max-width:430px;
  padding:30px;
  border-radius:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  text-align:center;
}

h2{
  color:#2563eb;
  margin-bottom:18px;
}

input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:2px solid #e2e8f0;
  font-size:15px;
  margin-bottom:15px;
}

.buttons{
  display:flex;
  gap:10px;
}

button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.btn-primary{ background:#2563eb; color:#fff; }
.btn-success{ background:#16a34a; color:#fff; }

#qrcode{
  margin:25px auto;
  width:250px;
  height:250px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f1f5f9;
  border-radius:18px;
}

#expiry{
  font-size:14px;
  color:#64748b;
}
</style>
</head>

<body>

<div class="card">

<h2>🔗 Payment QR Generator</h2>

<input type="text" id="link" placeholder="যেকোনো Payment Link পেস্ট করুন" />

<div class="buttons">
  <button class="btn-primary" onclick="generateQR()">QR তৈরি</button>
  <button class="btn-success" onclick="downloadQR()">ডাউনলোড</button>
</div>

<div id="qrcode"></div>
<div id="expiry"></div>

</div>

<script>
let qrTimeout;

/* ===== Generate QR (ANY LINK) ===== */
function generateQR(){

  const input=document.getElementById("link").value.trim();
  const box=document.getElementById("qrcode");
  const expiry=document.getElementById("expiry");

  box.innerHTML="";
  expiry.innerText="";

  if(!input){
    alert("লিংক দিন");
    return;
  }

  QRCode.toCanvas(input,{width:250},(err,canvas)=>{
    canvas.id="qrCanvas";
    box.appendChild(canvas);
  });

  expiry.innerText="⏳ ৩০ সেকেন্ড পর QR মেয়াদ শেষ হবে";

  clearTimeout(qrTimeout);
  qrTimeout=setTimeout(()=>{
    box.innerHTML="";
    expiry.innerText="❌ QR মেয়াদ শেষ";
  },30000);
}


/* ===== Download ===== */
function downloadQR(){
  const canvas=document.getElementById("qrCanvas");

  if(!canvas){
    alert("আগে QR তৈরি করুন");
    return;
  }

  const link=document.createElement("a");
  link.download="payment_qr.png";
  link.href=canvas.toDataURL();
  link.click();
}
</script>

</body>
</html>
